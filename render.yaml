# Render Blueprint for the SHS Boarding & Dorm Management System (STAGING).
#
# Entries marked `sync: false` are secrets/inputs you must set in the Render
# dashboard; never commit real credentials here. The database is Neon (external),
# so it is intentionally NOT declared as a Render database.
#
# Apply via Dashboard -> New -> Blueprint, selecting this repository.
# Adjust `branch`/`region`/`plan` to taste (defaults chosen to avoid paid
# resources; `preDeployCommand` requires a paid instance type - see below).
#
# Static assets
# -------------
# `buildCommand` does NOT run npm. Both stylesheets are committed to the
# repository (`static/css/output.css` for the application, `static/css/site.css`
# for the public marketing website) and are collected by `collectstatic`, so a
# deploy needs no Node toolchain. After editing `tailwind.site.config.js`,
# `static/src/site.css` or any file under `website/templates/`, rebuild and
# commit the result:
#
#   npm ci && npm run build:site
#
# The public marketing website
# ----------------------------
# The marketing site is served from `PUBLIC_WEBSITE_DOMAIN`, which is NOT a
# tenant. Do not add that hostname to the Domain table: the public host bypass
# in `tenancy.middleware.VerifiedDomainRoutingMiddleware` deliberately runs
# before tenant resolution, and registering the domain as a tenant would
# present a school's dashboard at the marketing address.
#
# Link hygiene
# ------------
# All the public site may link to is the main domain. Canonical links, Open
# Graph tags, the sitemap and the `Sitemap:` line in robots.txt are built from
# `SITE_URL` (falling back to `https://EDEN_SYS_DOMAIN`), so set `SITE_URL` to
# the main domain in production. `EDEN_PORTAL_LOGIN_URL` is published only when
# it is on that domain; a school's hostname is dropped and reported by the
# `website.W001` system check, because no page here may link to a tenant.

services:
  - type: web
    name: shs-boarding-staging
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py check --settings=schoolsystem.settings.build &&
      python manage.py collectstatic --noinput --settings=schoolsystem.settings.build
    startCommand: >-
      gunicorn schoolsystem.wsgi:application
      --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 60
    healthCheckPath: /healthz
    # Migrations. On a paid instance type, uncomment `preDeployCommand` so the
    # release runs them automatically before taking traffic. On Free, run these
    # two commands once from the Render Shell after the first deploy:
    #
    #   python manage.py migrate --schema public --settings=schoolsystem.settings.production
    #   python manage.py migrate --include-dynamic-schemas --settings=schoolsystem.settings.production
    #
    # preDeployCommand: >-
    #   python manage.py migrate --schema public --settings=schoolsystem.settings.production &&
    #   python manage.py migrate --include-dynamic-schemas --settings=schoolsystem.settings.production
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: schoolsystem.settings.production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_PROFILE
        value: neon
      - key: TENANCY_ENABLED
        value: "True"
      # Neon DIRECT (non-pooler) connection details.
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGSSLMODE
        value: require
      # Must be at least 50 characters with at least 5 unique characters, or
      # production refuses to start. Do NOT use `generateValue: true` here:
      # Render mints a base64-encoded 256-bit value (~44 characters), which is
      # shorter than this project's minimum. Generate one instead with:
      #   python -c "import secrets;print(secrets.token_urlsafe(64))"
      - key: DJANGO_SECRET_KEY
        sync: false
      # ALLOWED_HOSTS is ignored while TENANCY_ENABLED=True; leave empty.
      - key: ALLOWED_HOSTS
        sync: false
      # Must list the service's own origin AND the marketing host. The public
      # site is deliberately not a tenant, so DynamicCsrfMiddleware cannot fall
      # back to the Domain table for it and would reject the demonstration
      # form's HTTPS POST without this entry.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shs-boarding-staging.onrender.com,https://ecreativesys.com,https://www.ecreativesys.com"
      # Durable media (student photos, crests, ID exports).
      - key: MEDIA_STORAGE_BACKEND
        value: neon_s3
      - key: NEON_STORAGE_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Mail transport. Deliberately NOT pinned with `value:`: a `value:` entry
      # is re-applied on every Blueprint sync, which would silently revert a
      # dashboard change back to the console backend. Leave blank on a staging
      # service (falls back to the console backend, which never sends mail) and
      # set this on a service that must send real mail:
      #   django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_BACKEND
        sync: false
      # Transport. Not secret, so it is set here. EMAIL_USE_TLS and
      # EMAIL_USE_SSL are mutually exclusive; only one may be true.
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: DEFAULT_FROM_EMAIL
        value: "berkojohnson@gmail.com"
      # SMTP credentials are secrets: they stay out of the repository.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Keeps *school/guardian* SMS off, so no real messages reach parents.
      # It does NOT disable the demonstration-request alert below: that alert is
      # driven only by DEMO_REQUEST_SMS_TO.
      - key: SMS_ENABLED
        value: "False"
      # Sender ID for outgoing school SMS, and the fallback sender for the
      # demonstration-request alert. Must be approved on your SMSOnlineGH
      # account, so change it there first if it differs.
      - key: SMS_SENDER_ID
        value: "EDENSYS"
      # SMSOnlineGH credentials: secret. Required by the demonstration-request
      # alert and by school SMS dispatch.
      - key: SMS_ONLINE_GH_API_KEY
        sync: false
      # --- Public marketing website ---------------------------------------
      # Comma-separated hostnames that serve the marketing site. Hostnames
      # only: no scheme, no port, no path. Empty disables the bypass. Never
      # list a school's hostname here.
      - key: PUBLIC_WEBSITE_DOMAIN
        value: "ecreativesys.com,www.ecreativesys.com"
      - key: PUBLIC_WEBSITE_ENABLED
        value: "True"
      # The site's own absolute origin for canonical URLs, Open Graph tags, the
      # sitemap and the robots.txt Sitemap line. Production:
      # https://ecreativesys.com. Empty falls back to https://EDEN_SYS_DOMAIN.
      - key: SITE_URL
        value: "https://ecreativesys.com"
      # Where school staff sign in. Published only when it is on SITE_URL's
      # domain — the site never links to a school's hostname. Empty hides the
      # "Login" link entirely.
      - key: EDEN_PORTAL_LOGIN_URL
        sync: false
      # Leave False until an approved price list exists.
      - key: PRICING_PUBLIC_ENABLED
        value: "False"
      # Where demonstration requests are emailed. Empty falls back to
      # EDEN_SYS_EMAIL, then DEFAULT_FROM_EMAIL.
      - key: DEMO_REQUEST_NOTIFY_EMAILS
        value: "berkojohnson@gmail.com"
      # SMS alert for new demonstration requests: a platform alert to the
      # business, not a message to a school. Needs SMS_ONLINE_GH_API_KEY and is
      # independent of SMS_ENABLED. Every submission sends a real, chargeable
      # SMS, so this is left for the dashboard: set it to the destination
      # number(s), comma-separated, on the service that should send alerts, and
      # leave it blank on a staging service that should stay silent.
      - key: DEMO_REQUEST_SMS_TO
        sync: false
      - key: DEMO_REQUEST_SMS_SENDER
        value: "EDENSYS"
      # Staging: avoid pinning HTTPS for a year. Raise to 31536000 for production.
      - key: SECURE_HSTS_SECONDS
        value: "0"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Shared cache for cluster-wide rate limits (required in production).
      - key: CACHE_BACKEND
        sync: false
      - key: CACHE_LOCATION
        sync: false
      # Celery broker (needed only if the worker/beat services are enabled).
      - key: REDIS_URL
        sync: false
      # This staging blueprint intentionally deploys the web service only.
      # Setting this to False makes that choice explicit: `manage.py check`
      # emits core.W003, Celery Beat refuses to load periodic rows, and the
      # following do NOT run automatically:
      #   * queued SMS dispatch and overdue-exeat reminders
      #   * unfinished roll-call expiry
      #   * expired student ID export cleanup
      #   * SHS 3 academic-year phase-out
      # Turn this on only after adding paid worker + Beat services (see bottom).
      - key: BACKGROUND_JOBS_ENABLED
        value: "False"

# --- Background jobs are deliberately disabled in this staging blueprint ----
# Render does not deploy a Celery worker or Beat here, so SMS delivery, overdue
# reminders, roll-call expiry, ID-export cleanup, and SHS 3 phase-out are
# dormant. This is an explicit deployment choice, not an oversight: the web
# service sets BACKGROUND_JOBS_ENABLED=False and `manage.py check` warns.
#
# To enable them, approve the paid Render plan and add:
#   * a Render Key Value (Redis 6+) instance and set REDIS_URL on all services;
#   * a Background Worker:
#       startCommand: celery -A schoolsystem worker --loglevel=INFO
#   * a second Background Worker for Beat:
#       startCommand: celery -A schoolsystem beat --loglevel=INFO
# Give both the same env vars as the web service (at minimum DATABASE_PROFILE,
# PG*, TENANCY_ENABLED, REDIS_URL, MEDIA_STORAGE_BACKEND + S3 keys, SMS_*), and
# set BACKGROUND_JOBS_ENABLED=True on all three services. Never enable
# SMS_ENABLED=True without a worker and Beat: core.E004 blocks that combination.
