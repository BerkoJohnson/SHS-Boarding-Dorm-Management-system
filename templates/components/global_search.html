<!-- System-Wide Command Palette & Global Search Component -->
<div class="relative flex-1 min-w-0 max-w-lg" 
     x-data="{ 
         isOpen: false, 
         query: '',
         handleKeydown(e) {
             if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                 e.preventDefault();
                 this.$refs.searchInput.focus();
                 this.$refs.searchInput.select();
                 if (this.query.trim().length >= 2) {
                     this.isOpen = true;
                 }
             }
         },
         clearSearch() {
             this.query = '';
             this.isOpen = false;
             this.$refs.searchInput.value = '';
         }
     }"
     x-init="window.addEventListener('keydown', handleKeydown.bind($data))"
     @click.outside="isOpen = false"
     @keydown.escape.window="isOpen = false; $refs.searchInput.blur()">

  <!-- Input Field Container -->
  <div class="relative w-full">
    <input type="text" 
           name="q"
           x-ref="searchInput"
           x-model="query"
           @focus="if (query.trim().length >= 2) isOpen = true"
           @input="if (query.trim().length >= 2) isOpen = true; else isOpen = false"
           role="combobox"
           :aria-expanded="(isOpen && query.trim().length >= 2).toString()"
           aria-controls="global-search-results"
           aria-autocomplete="list"
           placeholder="Search student, admission no, house, dormitory..." 
           autocomplete="off"
           spellcheck="false"
           hx-get="{% url 'core:global_search' %}"
           hx-trigger="input changed delay:200ms[this.value.trim().length >= 2], search[this.value.trim().length >= 2]"
           hx-target="#global-search-results"
           hx-indicator="#search-spinner"
           class="w-full pl-9 pr-20 py-1.5 bg-slate-50/80 text-xs text-slate-800 placeholder-slate-400 rounded-lg border border-slate-200 focus:outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all shadow-2xs">

    <!-- Search Magnifying Glass Icon -->
    <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>

    <!-- Right Controls: Spinner, Clear, and ⌘K Badge -->
    <div class="absolute right-2.5 top-0 h-full flex items-center gap-1.5">
      <!-- Loading Indicator -->
      <div id="search-spinner" class="htmx-indicator">
        <svg class="animate-spin h-3.5 w-3.5 text-brand-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>

      <!-- Clear Button -->
      <button type="button" 
              x-show="query.length > 0" 
              x-cloak 
              @click="clearSearch()"
              class="text-slate-400 hover:text-slate-600 p-0.5 rounded transition"
              title="Clear search">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Keyboard Shortcut Badge -->
      <span class="hidden sm:inline-flex px-1.5 py-0.5 text-[10px] font-medium text-slate-400 bg-slate-200/70 rounded select-none pointer-events-none">⌘K</span>
    </div>
  </div>

  <!-- Search Results Dropdown Flyout -->
  <div id="global-search-results-wrapper"
       x-show="isOpen && query.trim().length >= 2"
       x-cloak
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 translate-y-1 scale-98"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-1 scale-98"
       class="absolute top-full left-0 mt-2 w-[580px] max-w-[min(580px,calc(100vw-4.5rem))] sm:max-w-[calc(100vw-2rem)] bg-white rounded-xl shadow-2xl border border-slate-200/90 z-50 overflow-hidden">
    <div id="global-search-results" class="max-h-[460px] overflow-y-auto">
      <!-- Search results loaded dynamically via HTMX -->
      <div class="p-6 text-center text-slate-400 text-xs">
        Searching across school records...
      </div>
    </div>
  </div>

</div>
