{% load static %}
<!-- TOP INCIDENT STATS STRIP (out-of-band swapped on HTMX filter updates) -->
<div id="conduct-stats" {% if request.htmx %}hx-swap-oob="true"{% endif %} class="grid grid-cols-2 sm:grid-cols-4 gap-3">

    <!-- Total Incidents -->
    <div class="bg-white border border-slate-200/90 rounded-xl p-3 shadow-2xs flex items-center justify-between">
        <div>
            <span class="text-2xs font-medium text-slate-500 uppercase tracking-wide">Active Incidents</span>
            <div class="text-xl font-bold text-slate-900 tracking-tight mt-0.5">{{ total_incidents }}</div>
            <div class="text-2xs text-slate-400">{{ period_label|default:"All time" }} · excludes corrected</div>
        </div>
        <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </div>
    </div>

    <!-- Critical Cases -->
    <div class="bg-white border border-slate-200/90 rounded-xl p-3 shadow-2xs flex items-center justify-between">
        <div>
            <span class="text-2xs font-medium text-slate-500 uppercase tracking-wide">Critical Infractions</span>
            <div class="text-xl font-bold text-rose-600 tracking-tight mt-0.5">{{ critical_count }}</div>
            <div class="text-2xs text-rose-500 font-medium">Disciplinary Committee</div>
        </div>
        <div class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center shrink-0 border border-rose-200/60">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
    </div>

    <!-- Major Offenses -->
    <div class="bg-white border border-slate-200/90 rounded-xl p-3 shadow-2xs flex items-center justify-between">
        <div>
            <span class="text-2xs font-medium text-slate-500 uppercase tracking-wide">Major Offenses</span>
            <div class="text-xl font-bold text-amber-600 tracking-tight mt-0.5">{{ major_count }}</div>
            <div class="text-2xs text-amber-500 font-medium">Internal Sanctions</div>
        </div>
        <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center shrink-0 border border-amber-200/60">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
    </div>

    <!-- Minor Offenses -->
    <div class="bg-white border border-slate-200/90 rounded-xl p-3 shadow-2xs flex items-center justify-between">
        <div>
            <span class="text-2xs font-medium text-slate-500 uppercase tracking-wide">Minor Infractions</span>
            <div class="text-xl font-bold text-sky-600 tracking-tight mt-0.5">{{ minor_count }}</div>
            <div class="text-2xs text-sky-500 font-medium">Duty & Work Penalties</div>
        </div>
        <div class="w-8 h-8 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center shrink-0 border border-sky-200/60">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
    </div>

</div>
