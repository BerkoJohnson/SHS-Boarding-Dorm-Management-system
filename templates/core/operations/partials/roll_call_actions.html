<div id="roll-call-actions" {% if oob %}hx-swap-oob="outerHTML"{% endif %} class="flex items-center gap-2">
  {% if current_session.status == 'In Progress' %}
    <form method="post" action="{% url 'core:roll_call_mark_all_present' current_session.id %}">
      {% csrf_token %}
      <button type="submit"
              {% if current_session.is_expired %}disabled title="This roll call has expired"{% endif %}
              class="px-2.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold rounded-lg text-xs border border-emerald-200 transition shadow-2xs">
        Mark All Present
      </button>
    </form>
    <form method="post" action="{% url 'core:roll_call_complete' current_session.id %}">
      {% csrf_token %}
      <button type="submit"
              {% if current_session.unmarked_count or current_session.is_expired %}disabled title="{% if current_session.is_expired %}This roll call has expired{% else %}Mark all students before finalizing{% endif %}"{% endif %}
              class="px-3 py-1.5 bg-[#0f172a] hover:bg-slate-800 text-white font-medium rounded-lg text-xs transition shadow-xs disabled:opacity-50 disabled:cursor-not-allowed">
        Finalize Roll Call
      </button>
    </form>
  {% elif current_session.status == 'Expired' %}
    <span class="text-xs text-rose-500 italic">Roll call expired &mdash; records preserved and locked.</span>
  {% else %}
    <span class="text-xs text-slate-400 italic">Roll call records finalized & archived.</span>
  {% endif %}
</div>
