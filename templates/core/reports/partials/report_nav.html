{% comment %}
Destination tabs for the boarding reporting area.
Context:
  active_report – one of "occupancy", "kpi", "demographics", "sms", "config".
{% endcomment %}
<nav class="flex flex-wrap items-center gap-1 rounded-xl border border-slate-200 bg-white p-1.5 shadow-sm"
     aria-label="Boarding reports">
  <a href="{% url 'core:reports' %}"
     class="inline-flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold transition {% if active_report == 'occupancy' %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}"
     {% if active_report == 'occupancy' %}aria-current="page"{% endif %}>Occupancy &amp; placement</a>
  <a href="{% url 'core:boarding_kpi' %}"
     class="inline-flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold transition {% if active_report == 'kpi' %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}"
     {% if active_report == 'kpi' %}aria-current="page"{% endif %}>Termly KPI pack</a>
  <a href="{% url 'core:boarding_demographics' %}"
     class="inline-flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold transition {% if active_report == 'demographics' %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}"
     {% if active_report == 'demographics' %}aria-current="page"{% endif %}>Demographics</a>
  <a href="{% url 'core:sms_usage' %}"
     class="inline-flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold transition {% if active_report == 'sms' %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}"
     {% if active_report == 'sms' %}aria-current="page"{% endif %}>SMS usage</a>
  {% if can_view_config %}
    <a href="{% url 'core:config_audit' %}"
       class="inline-flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold transition {% if active_report == 'config' %}bg-slate-900 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}"
       {% if active_report == 'config' %}aria-current="page"{% endif %}>Config audit</a>
  {% endif %}
</nav>
